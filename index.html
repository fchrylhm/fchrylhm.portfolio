<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Muhamad Fahri Ilham — Portfolio</title>
  <meta name="description" content="Personal portfolio of Muhamad Fahri Ilham — Information Systems student focusing on Software Engineering, Web Development, and Data/AI." />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Fahri Ilham — Portfolio" />
  <meta property="og:description" content="Selected projects, experience, and technical explorations." />
  <meta property="og:image" content="assets/images/og-preview.jpg" />

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23020617'/%3E%3Cpath d='M16 4 L18.4 13.6 L28 16 L18.4 18.4 L16 28 L13.6 18.4 L4 16 L13.6 13.6 Z' fill='%2360A5FA'/%3E%3C/svg%3E" />

  <!-- New Typography: Outfit, Manrope & Instrument Serif -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <div class="scroll-progress" id="scroll-progress" aria-hidden="true"></div>
  <!-- Layered Deep Space Background (Fixed di z-index 0 & 1) -->
  <div class="space-bg" aria-hidden="true">
    <div class="nebula nebula--1"></div>
    <div class="nebula nebula--2"></div>
    <div class="nebula nebula--3"></div>
  </div>
  <canvas id="starfield" aria-hidden="true"></canvas>

  <!-- Floating Glossy Capsule Navbar -->
  <header class="navbar" id="navbar">
    <div class="navbar__pill">
      <a href="#hero" class="navbar__brand" id="nav-brand" translate="no">fahri.</a>

      <nav class="navbar__menu" id="nav-menu" aria-label="Main navigation">
        <a href="#about" class="navbar__link" data-i18n="nav.about">About</a>
        <a href="#journey" class="navbar__link" data-i18n="nav.journey">Journey</a>
        <a href="#projects" class="navbar__link" data-i18n="nav.projects">Projects</a>
        <a href="#achievements" class="navbar__link" id="nav-achievements-link" data-i18n="nav.awards">Awards</a>
        <a href="#contact" class="navbar__link navbar__cta" data-i18n="nav.contact">Contact</a>
      </nav>

      <div class="navbar__actions">
        <button
          type="button"
          class="lang-toggle"
          id="lang-toggle"
          data-lang="en"
          aria-label="Switch language"
        >
          <span class="lang-toggle__thumb" aria-hidden="true"></span>
          <span class="lang-toggle__opt" data-opt="en">EN</span>
          <span class="lang-toggle__opt" data-opt="id">ID</span>
        </button>

        <button class="navbar__toggle" id="nav-toggle" aria-label="Toggle navigation menu" aria-expanded="false">
          <span></span>
          <span></span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <section id="hero" class="section hero"></section>

    <section id="about" class="section about">
      <div class="container" id="about-container"></div>
    </section>

    <section id="journey" class="section journey">
      <div class="container" id="journey-container"></div>
    </section>

    <section id="projects" class="section projects">
      <div class="container" id="projects-container"></div>
    </section>

    <section id="achievements" class="section achievements">
      <div class="container" id="achievements-container"></div>
    </section>

    <section id="contact" class="section contact">
      <div class="container" id="contact-container"></div>
    </section>
  </main>

  <footer class="footer" id="footer"></footer>

  <!-- Project Detail Modal -->
  <div class="modal" id="project-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
    <div class="modal__backdrop" data-close-modal></div>
    <div class="modal__dialog">
      <button class="modal__close" type="button" aria-label="Close modal" data-close-modal>&times;</button>
      <div class="modal__content" id="modal-content"></div>
    </div>
  </div>

  <!-- Shared Image Lightbox (Single & Multi-Photo Carousel) -->
  <div class="modal lightbox" id="lightbox-modal" role="dialog" aria-modal="true" aria-label="Image preview" hidden>
    <div class="modal__backdrop" data-close-lightbox></div>
    <div class="lightbox__dialog" id="lightbox-dialog">
      <button class="modal__close" type="button" aria-label="Close preview" data-close-lightbox>&times;</button>

      <div class="lightbox__stage">
        <button class="lightbox__nav lightbox__nav--prev" id="lightbox-prev" type="button" aria-label="Previous image" hidden>&lsaquo;</button>
        <img src="" alt="" class="lightbox__img" id="lightbox-img" />
        <button class="lightbox__nav lightbox__nav--next" id="lightbox-next" type="button" aria-label="Next image" hidden>&rsaquo;</button>
      </div>

      <div class="lightbox__meta">
        <span class="lightbox__counter" id="lightbox-counter" hidden></span>
        <p class="lightbox__caption" id="lightbox-caption"></p>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
